images:
- name: ghcr.io/lsst-dm/embargo-butler-enqueue
  newTag: "1.2.1"
- name: ghcr.io/lsst-dm/embargo-butler-ingest
  newTag: "1.2.1"
- name: ghcr.io/lsst-dm/embargo-butler-idle
  newTag: "1.2.1"
- name: docker.io/redis
  newTag: "7.0.15"

namespace: lfa

resources:
- ns.yaml
- enqueue-deploy.yaml
- idle-deploy.yaml
- ingest-deploy.yaml
- redis-deploy.yaml

secretGenerator:
- name: s3
  files:
  - s3_access=etc/.secrets/access_key
  - s3_key=etc/.secrets/secret_key
- name: redis
  files:
  - redis-password=etc/.secrets/redis
- name: postgres-credentials
  files:
  - postgres-credentials.txt=etc/.secrets/postgres-credentials.txt
- name: notification
  files:
  - secret=etc/.secrets/notification
