---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embargo-butler-ingest-lfa
  labels:
    app: ingest-lfa
    site: summit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-lfa
      site: summit
  template:
    metadata:
      labels:
        app: ingest-lfa
        site: summit
    spec:
      securityContext:
        fsGroup: 4085
        runAsGroup: 4085
        runAsNonRoot: true
        runAsUser: 18296
      initContainers:
      - name: "fix-secret-permissions"
        image: "ghcr.io/lsst-dm/embargo-butler-ingest:prod"
        command:
        - "/bin/bash"
        - "-c"
        - |
          cp -RL /secrets-raw/* /secrets
          chmod 0400 /secrets/*
        volumeMounts:
        - mountPath: /secrets-raw
          name: postgres-credentials
          readOnly: true
        - mountPath: /secrets
          name: secrets
      containers:
      - name: ingest
        image: "ghcr.io/lsst-dm/embargo-butler-ingest:prod"
        command:
        - "/bin/bash"
        - "-c"
        - |
          export HOME="$TMPDIR"/"$LOGNAME"
          mkdir -p "$HOME"
          source loadLSST.bash
          setup lsst_obs
          python ingest/ingest.py
        env:
        - name: TMPDIR
          value: /tmp
        - name: SHELL
          value: /bin/bash
        - name: LOGNAME
          value: rubinmgr
        - name: S3_ENDPOINT_URL
          value: https://s3dfrgw.slac.stanford.edu
        - name: REDIS_HOST
          value: redis
        - name: BUCKET
          value: rubinobs-lfa-cp
        - name: BUTLER_REPO
          value: /sdf/group/rubin/repo/main/
        - name: PGUSER
          value: rubin
        - name: PGPASSFILE
          value: /secrets/.lsst/postgres-credentials.txt
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: redis-password
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3
              key: s3_access
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3
              key: s3_key
        resources:
          limits:
            cpu: 500m
            memory: "1Gi"
        volumeMounts:
        - mountPath: /tmp
          name: temp
        - mountPath: /secrets/.lsst
          name: secrets
        - mountPath: "/sdf/data/rubin"
          name: "sdf-data-rubin"
        - mountPath: "/sdf/group/rubin"
          name: "sdf-group-rubin"
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 100Mi
      - name: secrets
        emptyDir:
          sizeLimit: 10Mi
      - name: postgres-credentials
        secret:
          secretName: postgres-credentials
      - name: "sdf-data-rubin"
        persistentVolumeClaim:
          claimName: "sdf-data-rubin"
      - name: "sdf-group-rubin"
        persistentVolumeClaim:
          claimName: "sdf-group-rubin"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "sdf-data-rubin"
spec:
  storageClassName: "sdf-data-rubin"
  accessModes:
  - "ReadWriteMany"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "sdf-group-rubin"
spec:
  storageClassName: "sdf-group-rubin"
  accessModes:
  - "ReadWriteMany"
  resources:
    requests:
      storage: "1Gi"
